  <!-- Required React 18 & Router 6 Scripts -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/history@5/umd/history.development.js"></script>

    body {

<body class="bg-[#0f1419] text-[#e8eef4] antialiased select-none min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const { createRoot } = ReactDOM;
    const { MemoryRouter, Routes, Route, Link, useNavigate, useLocation } = ReactRouterDOM;

    // --- SHARED APP HEADER ---
    function Header({ title, backPath, showLiveBadge = true }) {
      const navigate = useNavigate();
      return (
        <header className="fixed top-0 inset-x-0 z-50 bg-[#0f1419]/90 backdrop-blur-xl border-b border-[#2C3744] pt-safe">
          <div className="h-16 px-4 flex items-center justify-between">
            <div className="flex items-center gap-2">
              {backPath ? (
                <button 
                  onClick={() => navigate(backPath)} 
                  className="w-10 h-10 flex items-center justify-center text-[#e8eef4] hover:text-primary transition-colors -ml-2"
                  aria-label="Back"
                >
                  <span className="material-symbols-outlined text-[24px]">arrow_back</span>
                </button>
              ) : null}
              <span className="font-semibold text-lg text-[#e8eef4] tracking-tight">{title || "Aware Home"}</span>
              {showLiveBadge && (
                <div className="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-[#222B35] border border-[#2C3744] ml-1">
                  <span className="w-2 h-2 rounded-full bg-[#14B8A6] animate-pulse"></span>
                  <span className="text-[10px] text-[#8B98A5] uppercase font-bold tracking-wider">Live</span>
                </div>
              )}
            </div>
            <div className="flex items-center gap-2">
              <Link to="/settings" className="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white text-xs font-semibold hover:opacity-90 transition-opacity">
                <span className="material-symbols-outlined text-[18px]">person</span>
              </Link>
            </div>
          </div>
        </header>
      );
    }

    // --- SHARED BOTTOM NAV BAR ---
    function BottomNav() {
      const location = useLocation();
      const current = location.pathname;

      // Don't show bottom nav on full-screen login or desktop mode
      if (current === "/login") return null;

      const tabs = [
        { path: "/", label: "Home", icon: "home" },
        { path: "/devices", label: "Devices", icon: "devices" },
        { path: "/automation", label: "Automation", icon: "hdr_auto" },
        { path: "/energy", label: "Energy", icon: "bolt" },
        { path: "/security", label: "Security", icon: "shield" },
      ];

      return (
        <nav className="fixed bottom-0 inset-x-0 z-50 bg-[#0f1419]/95 backdrop-blur-xl border-t border-[#2C3744] pb-safe shadow-lg">
          <div className="flex items-center justify-around h-16 px-2">
            {tabs.map((tab) => {
              const active = current === tab.path || (tab.path === "/security" && current === "/security/alert");
              return (
                <Link
                  key={tab.path}
                  to={tab.path}
                  className={`flex flex-col items-center justify-center w-16 h-12 gap-0.5 transition-colors ${
                    active ? "text-[#0052f2] font-semibold" : "text-[#8B98A5] hover:text-[#e8eef4]"
                  }`}
                >
                  <span className={`material-symbols-outlined text-[22px] ${active ? "material-symbols-filled text-[#0052f2]" : ""}`}>
                    {tab.icon}
                  </span>
                  <span className="text-[10px]">{tab.label}</span>
                </Link>
              );
            })}
          </div>
        </nav>
      );
    }

    // ==========================================
    // SCREEN 1: LOGIN PAGE
    // ==========================================
    function LoginPage() {
      const navigate = useNavigate();
      const [email, setEmail] = useState("resident@awarehome.internal");
      const [password, setPassword] = useState("••••••••••••");
      const [showPass, setShowPass] = useState(false);
      const [loading, setLoading] = useState(false);

      const handleSignIn = (e) => {
        if (e) e.preventDefault();
        setLoading(true);
        setTimeout(() => {
          setLoading(false);
          navigate("/");
        }, 800);
      };

      return (
        <div className="min-h-screen bg-[#0f1419] flex flex-col justify-center px-5 py-8 relative overflow-hidden">
          <div className="absolute -top-24 left-1/2 -translate-x-1/2 w-80 h-80 bg-primary/15 rounded-full blur-3xl pointer-events-none"></div>

          <div className="flex flex-col items-center text-center mb-6">
            <div className="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#1A2129] border border-[#2C3744] mb-4">
              <span className="w-2 h-2 rounded-full bg-[#14B8A6] animate-pulse"></span>
              <span className="text-xs text-[#8B98A5] uppercase tracking-wider font-mono">Aware OS v2.4</span>
            </div>
            
            <div className="w-20 h-20 rounded-2xl bg-gradient-to-tr from-[#0052f2] to-[#14B8A6] flex items-center justify-center p-0.5 shadow-xl mb-3">
              <div className="w-full h-full bg-[#1A2129] rounded-2xl flex items-center justify-center">
                <span className="material-symbols-outlined text-4xl text-[#0052f2]">sensors</span>
              </div>
            </div>
            <h1 className="text-2xl font-bold tracking-tight text-[#e8eef4]">Aware Home</h1>
            <p className="text-sm text-[#8B98A5] mt-1">Smarter home. Lower bills.</p>
          </div>

          <div className="bg-[#1A2129] border border-[#2C3744] rounded-2xl p-5 shadow-2xl max-w-md mx-auto w-full">
            <h2 className="text-lg font-semibold text-[#e8eef4]">Welcome back</h2>
            <p className="text-xs text-[#8B98A5] mb-5">Sign in to monitor household grid & devices</p>

            <form onSubmit={handleSignIn} className="space-y-4">
              <div>
                <label className="text-xs text-[#8B98A5] block mb-1">Email Address</label>
                <div className="relative flex items-center">
                  <span className="material-symbols-outlined absolute left-3 text-[18px] text-[#8B98A5]">alternate_email</span>
                  <input 
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    className="w-full h-11 bg-[#222B35] rounded-lg pl-10 pr-3 text-sm text-[#e8eef4] focus:outline-none focus:ring-1 focus:ring-primary border border-transparent focus:border-primary"
                    required
                  />
                </div>
              </div>

              <div>
                <label className="text-xs text-[#8B98A5] block mb-1">Password</label>
                <div className="relative flex items-center">
                  <span className="material-symbols-outlined absolute left-3 text-[18px] text-[#8B98A5]">lock</span>
                  <input 
                    type={showPass ? "text" : "password"}
                    value={password}
                    onChange={(e) => setPassword(e.target.value)}
                    className="w-full h-11 bg-[#222B35] rounded-lg pl-10 pr-10 text-sm text-[#e8eef4] focus:outline-none focus:ring-1 focus:ring-primary border border-transparent focus:border-primary"
                    required
                  />
                  <button 
                    type="button" 
                    onClick={() => setShowPass(!showPass)}
                    className="absolute right-3 text-[#8B98A5] hover:text-[#e8eef4]"
                  >
                    <span className="material-symbols-outlined text-[18px]">
                      {showPass ? "visibility_off" : "visibility"}
                    </span>
                  </button>
                </div>
              </div>

              <div className="flex items-center justify-between text-xs pt-1">
                <label className="flex items-center gap-2 cursor-pointer text-[#8B98A5]">
                  <input type="checkbox" defaultChecked className="rounded accent-primary" />
                  <span>Remember device</span>
                </label>
                <span className="text-primary hover:underline cursor-pointer">Forgot password?</span>
              </div>

              <button 
                type="submit"
                disabled={loading}
                className="w-full h-11 bg-primary hover:bg-blue-600 active:scale-[0.98] rounded-lg text-white font-medium text-sm flex items-center justify-center gap-2 transition-all shadow-lg"
              >
                {loading ? (
                  <span className="w-5 h-5 rounded-full border-2 border-white border-t-transparent animate-spin"></span>
                ) : (
                  <>
                    <span>Sign in</span>
                    <span className="material-symbols-outlined text-[18px]">arrow_forward</span>
                  </>
                )}
              </button>

              <button 
                type="button"
                onClick={handleSignIn}
                className="w-full h-11 bg-[#222B35] hover:bg-[#2C3744] active:scale-[0.98] rounded-lg text-[#e8eef4] font-medium text-xs flex items-center justify-center gap-2 border border-[#2C3744] transition-all"
              >
                <span className="material-symbols-outlined text-[18px] text-primary">fingerprint</span>
                <span>Passkey or Face ID</span>
              </button>
            </form>
          </div>

          <div className="text-center mt-6 text-xs text-[#8B98A5] flex items-center justify-center gap-2">
            <span className="material-symbols-outlined text-sm text-[#14B8A6]">verified_user</span>
            <span>Secured Node Connection • TLS 1.3</span>
          </div>
        </div>
      );
    }

    // ==========================================
    // SCREEN 2: HOME DASHBOARD (MOBILE)
    // ==========================================
    function HomeScreen() {
      const navigate = useNavigate();
      const [houseMode, setHouseMode] = useState("auto");
      const [temp, setTemp] = useState(24.5);
      const [showAiCard, setShowAiCard] = useState(true);

      return (
        <div className="flex flex-col min-h-screen pb-24">
          <Header title="Aware Home" />
          <main className="pt-20 px-4 space-y-4 max-w-lg mx-auto w-full">
            {/* Greeting & Modes */}
            <div className="flex flex-col gap-3">
              <div>
                <h1 className="text-xl font-bold tracking-tight text-[#e8eef4]">Good evening, Ayush</h1>
                <p className="text-xs text-[#8B98A5] flex items-center gap-1.5 mt-0.5 font-mono">
                  <span>Thursday, Oct 24</span>
                  <span>•</span>
                  <span>Oakridge Residence</span>
                </p>
              </div>

              {/* Mode Selector */}
              <div className="grid grid-cols-4 gap-1 p-1 bg-[#1A2129] border border-[#2C3744] rounded-xl">
                {[
                  { id: "home", label: "Home", icon: "home" },
                  { id: "away", label: "Away", icon: "directions_walk" },
                  { id: "night", label: "Night", icon: "bedtime" },
                  { id: "auto", label: "Auto", icon: "auto_mode" }
                ].map(mode => (
                  <button
                    key={mode.id}
                    onClick={() => setHouseMode(mode.id)}

                      houseMode === mode.id

                        : "text-[#8B98A5] hover:text-[#e8eef4]"
                    }`}
                  >
                    <span className="material-symbols-outlined text-[17px]">{mode.icon}</span>
                    <span>{mode.label}</span>
                  </button>
                ))}
              </div>
            </div>

            {/* Indoor Climate Hero */}
            <div 
              onClick={() => navigate("/device-detail")}
              className="bg-[#1A2129] border border-[#2C3744] rounded-2xl p-4 flex flex-col gap-3 cursor-pointer hover:border-primary/50 transition-colors shadow-sm"
            >
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-[#14B8A6] animate-pulse"></span>
                  <span className="text-xs font-semibold text-[#8B98A5] uppercase tracking-wider">Indoor Climate</span>
                </div>
                <div className="flex items-center gap-1 bg-[#222B35] px-2.5 py-1 rounded-full text-xs text-[#14B8A6]">
                  <span className="material-symbols-outlined text-[14px]">sunny</span>
                  <span>Outdoor 31°C</span>
                </div>
              </div>

              <div className="flex items-baseline justify-between">
                <div>
                  <div className="flex items-baseline gap-1">
                    <span className="text-4xl font-bold font-mono text-[#e8eef4]">{temp.toFixed(1)}</span>
                    <span className="text-sm font-semibold text-[#8B98A5]">°C</span>
                  </div>
                  <p className="text-xs text-[#14B8A6] flex items-center gap-1 mt-1 font-medium">
                    <span className="material-symbols-outlined text-[14px]">check_circle</span>
                    Target Optimal (Tap for dial)
                  </p>
                </div>
                <div className="flex flex-col gap-1.5 items-end">
                  <div className="flex items-center gap-2 bg-[#222B35] px-2.5 py-1 rounded-lg text-xs">
                    <span className="material-symbols-outlined text-[16px] text-blue-400">humidity_mid</span>
                    <span className="font-mono font-semibold">58% RH</span>
                  </div>
                  <div className="flex items-center gap-2 bg-[#222B35] px-2.5 py-1 rounded-lg text-xs">
                    <span className="material-symbols-outlined text-[16px] text-[#14B8A6]">group</span>
                    <span>2 home</span>
                  </div>
                </div>
              </div>
            </div>

            {/* Quick 3 Status Indicators */}
            <div className="grid grid-cols-3 gap-2">
              <Link to="/devices" className="bg-[#1A2129] border border-[#2C3744] rounded-xl p-3 flex flex-col justify-between hover:border-primary/40">
                <div className="flex items-center justify-between">
                  <span className="material-symbols-outlined text-amber-400 text-[20px]">lightbulb</span>
                  <span className="w-1.5 h-1.5 rounded-full bg-[#14B8A6]"></span>
                </div>
                <div className="mt-2">
                  <span className="text-[10px] uppercase text-[#8B98A5] block">Lighting</span>
                  <span className="text-sm font-semibold font-mono block">5 of 12</span>
                  <span className="text-[10px] text-[#14B8A6]">Active</span>
                </div>
              </Link>

              <Link to="/device-detail" className="bg-[#1A2129] border border-[#2C3744] rounded-xl p-3 flex flex-col justify-between hover:border-primary/40">
                <div className="flex items-center justify-between">
                  <span className="material-symbols-outlined text-[#14B8A6] text-[20px]">air</span>
                  <span className="w-1.5 h-1.5 rounded-full bg-[#14B8A6]"></span>
                </div>
                <div className="mt-2">
                  <span className="text-[10px] uppercase text-[#8B98A5] block">Climate</span>
                  <span className="text-sm font-semibold font-mono block">AC Cooling</span>
                  <span className="text-[10px] text-[#8B98A5]">24.0° Set</span>
                </div>
              </Link>

              <Link to="/security" className="bg-[#1A2129] border border-[#2C3744] rounded-xl p-3 flex flex-col justify-between hover:border-primary/40">
                <div className="flex items-center justify-between">
                  <span className="material-symbols-outlined text-emerald-400 text-[20px]">shield</span>
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                </div>
                <div className="mt-2">
                  <span className="text-[10px] uppercase text-[#8B98A5] block">Security</span>
                  <span className="text-sm font-semibold block">Armed</span>
                  <span className="text-[10px] text-emerald-400">All secure</span>
                </div>
              </Link>
            </div>

            {/* Energy Mini Card with Sparkline */}
            <Link to="/energy" className="block bg-[#1A2129] border border-[#2C3744] rounded-2xl p-4 hover:border-primary/40 transition-colors">
              <div className="flex items-center justify-between mb-2">
                <div className="flex items-center gap-1.5">
                  <span className="material-symbols-outlined text-primary text-[18px]">bolt</span>
                  <span className="text-xs font-semibold text-[#8B98A5] uppercase tracking-wider">Energy Today</span>
                </div>
                <span className="text-xs text-[#14B8A6] bg-[#222B35] px-2 py-0.5 rounded-full font-mono">-12% vs norm</span>
              </div>
              <div className="flex items-baseline gap-2 mb-2">

                    points="0,48 40,45 80,50 120,40 160,35 200,24 240,28 280,18 320,14 340,16"

            {/* AI Suggestion Card */}
            {showAiCard && (

                <div className="flex items-center gap-2">
                  <span className="material-symbols-outlined text-primary text-[20px]">psychology</span>
                  <span className="text-xs font-semibold text-primary uppercase tracking-wider">Aware Assist</span>
                </div>
                <h3 className="text-sm font-semibold text-[#e8eef4]">Pre-cool living room at 5:30 PM</h3>
                <p className="text-xs text-[#8B98A5]">Shift compression ahead of peak tariff surge to save ~0.8 kWh.</p>
                <div className="flex gap-2 pt-1">
                  <button 
                    onClick={() => {
                      alert("Automated schedule applied!");
                      setShowAiCard(false);
                    }}
                    className="flex-1 h-9 rounded-lg bg-primary text-white text-xs font-medium hover:bg-blue-600"
                  >
                    Apply Schedule
                  </button>
                  <button 
                    onClick={() => setShowAiCard(false)}
                    className="h-9 px-3 rounded-lg bg-[#222B35] text-[#8B98A5] text-xs hover:text-[#e8eef4]"

                    Dismiss

                </div>

                  >
                    <span className="material-symbols-outlined text-[20px] text-primary">{act.icon}</span>
                    <span className="text-[10px] text-[#8B98A5] truncate w-full text-center">{act.label}</span>
                  </button>
                ))}

            </div>

            {/* Web View Switch Banner */}
            <div className="p-3 bg-[#1A2129] border border-[#2C3744] rounded-xl flex items-center justify-between text-xs">
              <span className="text-[#8B98A5]">Viewing in Mobile Stack</span>
              <Link to="/desktop" className="text-primary font-semibold flex items-center gap-1">
                <span>Open Desktop Dashboard</span>
                <span className="material-symbols-outlined text-sm">desktop_windows</span>
              </Link>
            </div>
          </main>

    // ==========================================
    // SCREEN 3: DEVICES LIST SCREEN
    // ==========================================

        { name: "Living Room", count: "3 devices active", icon: "chair" },

                    <div className="flex justify-between items-baseline">
                      <div>
                        <div className="text-5xl font-bold font-mono text-[#e8eef4]">{temp.toFixed(1)}°C</div>
                        <span className="text-xs text-[#14B8A6] mt-1 block">Comfort Target Optimal</span>
                      </div>
                      <div className="flex gap-1">
                        <button 
                          onClick={() => setTemp(temp - 0.5)}
                          className="w-9 h-9 rounded-lg bg-[#222B35] text-white flex items-center justify-center font-bold"
                        >
                          -
                        </button>
                        <button 
                          onClick={() => setTemp(temp + 0.5)}
                          className="w-9 h-9 rounded-lg bg-[#222B35] text-white flex items-center justify-center font-bold"
                        >
                          +

                    <div className="grid grid-cols-3 gap-2 bg-[#222B35] p-3 rounded-xl text-xs text-center font-mono">

                      </div>
                    </div>
                  </div>

                  {/* Security Instrument */}
                  <div className="bg-[#1A2129] border border-[#2C3744] rounded-2xl p-5 space-y-3">
                    <div className="flex justify-between items-center text-xs">
                      <span className="font-semibold uppercase tracking-wider text-[#8B98A5]">Perimeter Security</span>
                      <span className="text-emerald-400 font-mono">ARMED: HOME</span>
                    </div>
                    <div className="space-y-2 text-xs">
                      {["Front Door (Closed)", "Living Casement (Closed)", "Hall PIR (Clear)", "Master Deadbolt (Locked)"].map((z, idx) => (
                        <div key={idx} className="flex justify-between p-2 bg-[#222B35] rounded-lg">
                          <span>{z}</span>
                          <span className="w-2 h-2 rounded-full bg-emerald-400 mt-1"></span>
                        </div>

                    </div>
                  </div>
                </div>

                {/* Column 2: Load Histogram & AI */}
                <div className="space-y-6">
                  <div className="bg-[#1A2129] border border-[#2C3744] rounded-2xl p-5 space-y-3">
                    <div className="flex justify-between text-xs">
                      <span className="font-semibold uppercase tracking-wider text-[#8B98A5]">Daily Load Telemetry</span>
                      <span className="text-primary font-mono">Instant: 480W</span>
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-4xl font-bold font-mono">3.2</span>
                      <span className="text-sm text-[#8B98A5]">kWh total</span>
                    </div>
                    {/* Histogram bars */}
                    <div className="h-32 flex items-end gap-1.5 pt-4">
                      {[30, 25, 20, 40, 65, 45, 40, 55, 78, 92, 85, 20].map((h, i) => (
                        <div key={i} className="flex-1 bg-[#222B35] hover:bg-primary rounded-t transition-all" style={{ height: `${h}%` }}></div>
                      ))}
                    </div>
                    <div className="flex justify-between text-[10px] text-[#8B98A5] font-mono">
                      <span>00:00</span>
                      <span>06:00</span>
                      <span>12:00</span>
                      <span>18:00</span>
                      <span>Now</span>
                    </div>
                  </div>

                  {/* Aware Assist */}
                  <div className="bg-[#1A2129] border border-primary/50 rounded-2xl p-5 space-y-2">
                    <div className="flex items-center gap-1.5 text-primary text-xs font-bold uppercase">
                      <span className="material-symbols-outlined text-[16px]">psychology</span>
                      <span>Aware Assist Model</span>
                    </div>
                    <h3 className="text-sm font-bold text-[#e8eef4]">Pre-cool living room at 5:30 PM</h3>
                    <p className="text-xs text-[#8B98A5]">Shift compression ahead of peak tariff surge to avoid expensive kilowatt-hour rates. Estimated savings: ~0.8 kWh.</p>

                      onClick={() => alert("Schedule dispatched to thermostat.")}

                    >
                      Apply Schedule
                    </button>
                  </div>
                </div>

                {/* Column 3: Telemetry Stream & Subsystems */}
                <div className="space-y-6">
                  <div className="bg-[#1A2129] border border-[#2C3744] rounded-2xl p-5 space-y-3">
                    <span className="font-semibold uppercase tracking-wider text-[#8B98A5] text-xs">Subsystem Status</span>
                    <div className="space-y-2 text-xs">
                      <div className="p-3 bg-[#222B35] rounded-xl flex justify-between">
                        <div>
                          <span className="font-semibold block text-[#e8eef4]">Lighting Array</span>
                          <span className="text-[10px] text-[#8B98A5]">5 fixtures active</span>

                        <span className="text-primary font-mono">Online</span>

                      <div className="p-3 bg-[#222B35] rounded-xl flex justify-between">
                        <div>
                          <span className="font-semibold block text-[#e8eef4]">Mesh Bus</span>
                          <span className="text-[10px] text-[#8B98A5]">8 Online • 1 Ping Timed Out</span>
                        </div>
                        <span className="text-amber-400 font-mono">Warning</span>
                      </div>
                    </div>
                  </div>

                  {/* Activity stream */}
                  <div className="bg-[#1A2129] border border-[#2C3744] rounded-2xl p-5 space-y-3 text-xs">
                    <span className="font-semibold uppercase tracking-wider text-[#8B98A5] text-xs">Live Telemetry Events</span>
                    <div className="space-y-2.5">
                      <div className="flex gap-2">
                        <span className="w-1.5 h-1.5 rounded-full bg-primary mt-1.5"></span>
                        <div className="flex-1">
                          <span className="block text-[#e8eef4]">Front door locked automatically</span>
                          <span className="text-[10px] text-[#8B98A5]">12m ago</span>

                      </div>
                      <div className="flex gap-2">

                          <span className="text-[10px] text-[#8B98A5]">34m ago</span>

                      </div>
                      <div className="flex gap-2">

                        <div className="flex-1">
                          <span className="block text-[#e8eef4]">Kitchen Smart Plug ping timeout</span>
                          <span className="text-[10px] text-[#8B98A5]">2h ago</span>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </main>
          </div>
        </div>
      );
    }

    function App() {
      return (
        <MemoryRouter initialEntries={["/"]}>
          <div className="flex flex-col min-h-screen bg-[#0f1419] text-[#e8eef4]">
            <Routes>
              {/* Screen 1: Home Dashboard */}
              <Route path="/" element={<HomeScreen />} />
              {/* Screen 2: Login */}
              <Route path="/login" element={<LoginPage />} />
              {/* Screen 3: Devices List */}
              <Route path="/devices" element={<DevicesScreen />} />
              {/* Screen 4: Device Detail Dial */}
              <Route path="/device-detail" element={<DeviceDetailScreen />} />
              {/* Screen 5: Add Device / Room Picker */}
              <Route path="/add-device" element={<AddDeviceScreen />} />
              {/* Screen 6: Automation Rules */}
              <Route path="/automation" element={<AutomationScreen />} />
              {/* Screen 7: Rule Builder */}
              <Route path="/rule-builder" element={<RuleBuilderScreen />} />
              {/* Screen 8: Energy Telemetry */}
              <Route path="/energy" element={<EnergyScreen />} />
              {/* Screen 9: Security Console */}
              <Route path="/security" element={<SecurityScreen />} />
              {/* Screen 10: Security Critical Alert */}
              <Route path="/security/alert" element={<SecurityAlertScreen />} />
              {/* Screen 11: Settings */}
              <Route path="/settings" element={<SettingsScreen />} />
              {/* Screen 12: Desktop Telemetry Dashboard */}
              <Route path="/desktop" element={<DesktopDashboardScreen />} />
            </Routes>
            <BottomNav />
          </div>
        </MemoryRouter>
      );
    }

    const root = createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
